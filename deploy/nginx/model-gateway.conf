# Optional model-only HTTP listener; backend stays on the Compose network.
server {
    listen 8000;
    server_name _;
    server_tokens off;
    client_max_body_size 101m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = / {
        limit_except POST { deny all; }
        proxy_pass http://skill_manager_backend;
    }
    location ~ ^/(models|v1/models(?:/[^?]+)?)$ {
        limit_except GET { deny all; }
        proxy_pass http://skill_manager_backend;
    }
    location ~ ^/(v1/(chat/completions|responses|messages(/count_tokens)?)|chat/completions|api/v1/llm/chat/completions)$ {
        limit_except POST { deny all; }
        proxy_pass http://skill_manager_backend;
    }
    location ~ ^/(v1beta/models/.+:(generateContent|streamGenerateContent)|client-models/[0-9a-f]+/(v1/messages|v1beta/models/.+:(generateContent|streamGenerateContent)))$ {
        limit_except POST { deny all; }
        proxy_pass http://skill_manager_backend;
    }
    location / { return 404; }
}
