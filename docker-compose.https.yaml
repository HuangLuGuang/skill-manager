services:
  nginx:
    entrypoint: ["/bin/sh", "/etc/nginx/https.sh"]
    ports:
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/http.conf:ro
      - ./deploy/nginx/https.sh:/etc/nginx/https.sh:ro
      - tls_certificates:/certificates:ro
    depends_on:
      certificates:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1/"]
