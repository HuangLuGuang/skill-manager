version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-false}
      DATA_DIR: /app/runtime/data
      UPLOADS_DIR: /app/runtime/uploads
      SQLITE_PATH: /app/runtime/sqlite/admin_starter.db
      SKILL_MANAGER_DATA_DIR: /app/runtime/skill_manager
      SKILL_MANAGER_SANDBOX_RUNTIME: ${SKILL_MANAGER_SANDBOX_RUNTIME:-remote}
      SKILL_MANAGER_SANDBOX_URL: ${SKILL_MANAGER_SANDBOX_URL:-http://sandbox:8194}
      SKILL_MANAGER_SANDBOX_API_KEY: ${SKILL_MANAGER_SANDBOX_API_KEY:-sandbox-change-me}
    depends_on:
      sandbox:
        condition: service_healthy
    volumes:
      - backend_data:/app/runtime/data
      - backend_uploads:/app/runtime/uploads
      - backend_sqlite:/app/runtime/sqlite
      - skill_manager_registry:/app/runtime/skill_manager
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  sandbox:
    build:
      context: .
      dockerfile: services/isolated-sandbox-service/Dockerfile
    env_file:
      - .env
    environment:
      SANDBOX_SERVICE_BACKEND: ${SANDBOX_SERVICE_BACKEND:-subprocess}
      SANDBOX_SERVICE_API_KEY: ${SANDBOX_SERVICE_API_KEY:-sandbox-change-me}
      SANDBOX_SERVICE_WORK_ROOT: /tmp/isolated-sandbox-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8194/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
  backend_sqlite:
  skill_manager_registry:
