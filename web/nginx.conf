server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /docs is both a Vue route and the directory containing documentation
    # screenshots. Serve the SPA entry for the route itself while leaving
    # /docs/screenshots/* available as static files.
    location = /docs {
        try_files /index.html =404;
    }

    location = /docs/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
