[package]
name = "agent-manager-client-desktop"
version = "0.1.0"
description = "智能体生命周期管理系统客户端"
authors = ["瑞数信息"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.0.2", features = [] }
tauri-codegen = "=2.0.2"

[dependencies]
libc = "0.2"
notify = "7.0.0"
notify-rust = "4.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.0.6", features = [] }
tauri-macros = "=2.0.2"
tauri-plugin-updater = "=2.0.2"
tauri-plugin-notification = "2"
tauri-runtime = "=2.1.1"
tauri-runtime-wry = "=2.1.2"
tauri-utils = "=2.0.2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Com", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
