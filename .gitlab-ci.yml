stages:
  - deploy
  - package

.release-on-35:
  tags:
    - agent-manager-release
  resource_group: production-35
  variables:
    RELEASE_DIR: /home/ubuntu/releases
    CLIENT_RELEASES: /home/ubuntu/releases/client-latest
    DOCKER_INSTALLER: /home/ubuntu/docker-installer-28.5.2-x86-arm.tar.gz
    DEPLOY_DIR: /home/ubuntu/skill-manager
    S3_BUCKET: condi
    S3_REGION: cn-northwest-1
    S3_ENDPOINT: https://s3.cn-northwest-1.amazonaws.com.cn
    BUILD_DOCKER_PROXY: http://10.10.8.66:1081
    BUILD_APT_PROXY: http://10.10.8.66:1081
    BUILD_GIT_PROXY: http://10.10.8.66:1081
    BUILD_GOPROXY: https://goproxy.cn
    BUILD_PYPI_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple

deploy-35:
  extends: .release-on-35
  stage: deploy
  timeout: 1h
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - |
      set -euo pipefail
      unset http_proxy https_proxy all_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY
      IMAGE_TAG="${CI_COMMIT_TAG:-dev-${CI_COMMIT_SHORT_SHA}}"

      notify() {
        local content="$1"
        if [ -z "${WECHAT_WEBHOOK_URL:-}" ]; then
          echo "WECHAT_WEBHOOK_URL is not configured; skipping notification"
          return 0
        fi
        python3 -c 'import json,sys; print(json.dumps({"msgtype":"text","text":{"content":sys.argv[1]}}, ensure_ascii=False))' "$content" \
          | curl --fail --silent --show-error --max-time 15 \
              -H 'Content-Type: application/json' \
              --data-binary @- "$WECHAT_WEBHOOK_URL" >/dev/null \
          || echo "Warning: WeCom notification failed"
      }

      notify "Agent Manager ${IMAGE_TAG} 开始部署\n${CI_PIPELINE_URL}"

      test -f "$DEPLOY_DIR/.env"
      docker info >/dev/null
      HTTP_PROXY="$BUILD_DOCKER_PROXY" \
      HTTPS_PROXY="$BUILD_DOCKER_PROXY" \
        ./build.sh -t "$IMAGE_TAG" -p linux/amd64 --all

      docker run --rm --entrypoint python "agent-manager-backend:${IMAGE_TAG}" -c '
      from fastapi.testclient import TestClient
      from backend.main import app

      with TestClient(app) as client:
          response = client.get("/health")
          response.raise_for_status()
      '

      docker run --rm --entrypoint sh "agent-manager-frontend:${IMAGE_TAG}" -c '
      nginx
      wget -qO- http://127.0.0.1/docs >/dev/null
      wget -qO- http://127.0.0.1/docs/ >/dev/null
      '

      install -m 0644 docker-compose.yaml "$DEPLOY_DIR/docker-compose.yaml"
      install -m 0644 docker-compose.https.yaml "$DEPLOY_DIR/docker-compose.https.yaml"
      install -d "$DEPLOY_DIR/deploy/nginx"
      install -m 0644 deploy/nginx/default.conf "$DEPLOY_DIR/deploy/nginx/default.conf"
      install -m 0644 deploy/nginx/https.sh deploy/nginx/certificates.py "$DEPLOY_DIR/deploy/nginx/"

      if grep -q '^TAG=' "$DEPLOY_DIR/.env"; then
        sed -i "s/^TAG=.*/TAG=${IMAGE_TAG}/" "$DEPLOY_DIR/.env"
      else
        printf '\nTAG=%s\n' "$IMAGE_TAG" >> "$DEPLOY_DIR/.env"
      fi

      cd "$DEPLOY_DIR"
      page_url=http://127.0.0.1/
      if grep -q '^DEPLOY_PROTOCOL=https$' .env; then
        export COMPOSE_FILE=docker-compose.yaml:docker-compose.https.yaml
        export COMPOSE_PROFILES=https
        page_url=https://127.0.0.1/
      fi
      docker compose run --rm --no-deps --pull never --entrypoint python backend -m backend.aidr_signing
      docker compose up -d --remove-orphans
      docker compose up -d --force-recreate --no-deps nginx

      for attempt in $(seq 1 40); do
        worker_id="$(docker compose ps -q agent-security-worker)"
        aig_service_id="$(docker compose ps -q aig-scan-service)"
        worker_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$worker_id" 2>/dev/null || true)"
        aig_service_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$aig_service_id" 2>/dev/null || true)"
        if curl --insecure --fail --silent --show-error --max-time 5 "$page_url" >/dev/null \
          && [ "$worker_health" = "healthy" ] \
          && [ "$aig_service_health" = "healthy" ]; then
          break
        fi
        if [ "$attempt" -eq 40 ]; then
          docker compose ps
          docker compose logs --tail=100 \
            backend frontend nginx sandbox agent-security-worker aig-scan-service
          exit 1
        fi
        sleep 5
      done

      docker compose ps
      docker compose exec -T backend python -m backend.aidr_signing --check
      notify "Agent Manager ${IMAGE_TAG} 已部署并通过健康检查\n${CI_PIPELINE_URL}"
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ] || [ -z "${WECHAT_WEBHOOK_URL:-}" ]; then
        exit 0
      fi
      IMAGE_TAG="${CI_COMMIT_TAG:-dev-${CI_COMMIT_SHORT_SHA}}"
      python3 -c 'import json,sys; print(json.dumps({"msgtype":"text","text":{"content":sys.argv[1]}}, ensure_ascii=False))' \
        "Agent Manager ${IMAGE_TAG} 部署失败\n${CI_JOB_URL}" \
        | curl --fail --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            --data-binary @- "$WECHAT_WEBHOOK_URL" >/dev/null \
        || true

.offline-package:
  extends: .release-on-35
  stage: package
  timeout: 4h
  script:
    - |
      set -euo pipefail
      unset http_proxy https_proxy all_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY

      notify() {
        python3 - "$1" <<'PY_NOTIFY'
      import json
      import os
      import sys
      import urllib.request

      payload = {"msgtype": "text", "text": {"content": sys.argv[1]}}
      request = urllib.request.Request(
          os.environ["WECHAT_WEBHOOK_URL"],
          data=json.dumps(payload, ensure_ascii=False).encode(),
          headers={"Content-Type": "application/json"},
      )
      with urllib.request.urlopen(request, timeout=15) as response:
          result = json.load(response)
      if result.get("errcode") != 0:
          raise SystemExit(f"WeCom notification failed: {result.get('errcode')}")
      PY_NOTIFY
      }

      : "${WECHAT_WEBHOOK_URL:?Configure WECHAT_WEBHOOK_URL for release download notifications}"
      notify "Agent Manager ${CI_COMMIT_TAG} 开始生成 ${PACKAGE_ARCH} 客户离线包
      ${CI_PIPELINE_URL}"

      test -f "$DOCKER_INSTALLER"
      test -f "$CLIENT_RELEASES/latest.json"
      command -v aws >/dev/null
      aws s3api head-bucket --bucket "$S3_BUCKET" --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION"
      docker info >/dev/null

      if [ "$PACKAGE_ARCH" = "arm" ]; then
        docker run --rm --platform linux/arm64 alpine:3.20 uname -m | grep -q '^aarch64$'
        # Both architectures share the Compose nginx tag on the deployment host.
        NGINX_X86_ID="$(docker image inspect --format '{{.Id}}' nginx:1.27-alpine)"
        test "$(docker image inspect --format '{{.Architecture}}' "$NGINX_X86_ID")" = amd64
        restore_nginx() {
          docker image tag "$NGINX_X86_ID" nginx:1.27-alpine
        }
        trap restore_nginx EXIT
      fi

      ARCHIVE="$RELEASE_DIR/agent-manager_${CI_COMMIT_TAG%_arm}_${PACKAGE_ARCH}.tar.gz"
      HTTP_PROXY="$BUILD_DOCKER_PROXY" \
      HTTPS_PROXY="$BUILD_DOCKER_PROXY" \
        ./package-release.sh \
          -v "$CI_COMMIT_TAG" \
          -b "$CI_COMMIT_TAG" \
          -p "$PACKAGE_PLATFORM" \
          -i "$DOCKER_INSTALLER" \
          -c "$CLIENT_RELEASES" \
          -o "$RELEASE_DIR"

      test -s "$ARCHIVE"
      tar -xOf "$ARCHIVE" "agent-manager/release-provenance.json" \
        | python3 scripts/verify-agent-manager-release-provenance.py \
            --file - \
            --version "$CI_COMMIT_TAG" \
            --commit "$CI_COMMIT_SHA" \
            --platform "$PACKAGE_PLATFORM" \
            --require-clean-clone
      tar -xOf "$ARCHIVE" "agent-manager/docker_images/${PACKAGE_ARCH}/agent-manager-images-${CI_COMMIT_TAG}.tar.xz" \
        | xz -dc \
        | docker load >/dev/null
      ./scripts/verify-agent-security-worker-image.sh "agent-manager-security-worker:${CI_COMMIT_TAG}" "${PACKAGE_PLATFORM#linux/}"
      ./scripts/verify-aig-scan-service-image.sh "agent-manager-aig-scan-service:${CI_COMMIT_TAG}" "${PACKAGE_PLATFORM#linux/}"

      if [ "$PACKAGE_ARCH" = "arm" ]; then
        restore_nginx
        test "$(docker image inspect --format '{{.Architecture}}' nginx:1.27-alpine)" = amd64
        trap - EXIT
      fi

      NAME="$(basename "$ARCHIVE")"
      S3_URI="s3://${S3_BUCKET}/agent-manager/${NAME}"
      aws s3 cp "$ARCHIVE" "$S3_URI" \
        --endpoint-url "$S3_ENDPOINT" \
        --region "$S3_REGION" \
        --content-type application/gzip \
        --content-disposition "attachment; filename=\"${NAME}\""
      aws s3api head-object --bucket "$S3_BUCKET" --key "agent-manager/${NAME}" \
        --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" >/dev/null
      DOWNLOAD_URL="$(aws s3 presign "$S3_URI" \
        --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" --expires-in 604800)"
      test -n "$DOWNLOAD_URL"
      python3 scripts/publish_release_notification.py \
        --archive "$ARCHIVE" \
        --download-url "$DOWNLOAD_URL" \
        --version "$CI_COMMIT_TAG" \
        --platform "$PACKAGE_PLATFORM" \
        --expires-in 604800
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ] || [ -z "${WECHAT_WEBHOOK_URL:-}" ]; then
        exit 0
      fi
      python3 -c 'import json,sys; print(json.dumps({"msgtype":"text","text":{"content":sys.argv[1]}}, ensure_ascii=False))' \
        "Agent Manager ${CI_COMMIT_TAG} 客户离线包发布失败（构建、校验、上传或通知）\n${CI_JOB_URL}" \
        | curl --fail --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            --data-binary @- "$WECHAT_WEBHOOK_URL" >/dev/null \
        || true

offline-package:
  extends: .offline-package
  needs:
    - deploy-35
  variables:
    PACKAGE_PLATFORM: linux/amd64
    PACKAGE_ARCH: x86
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'

offline-package-arm:
  extends: .offline-package
  variables:
    PACKAGE_PLATFORM: linux/arm64
    PACKAGE_ARCH: arm
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+_arm$/'
