[project]
name = "agent-manager-admin-backend"
version = "0.1.0"
description = "Admin starter backend for Agent Manager"
requires-python = ">=3.10"
dependencies = [
    "cisco-ai-skill-scanner",
    "fastapi",
    "httpx",
    "httpx[socks]",
    "jsonschema",
    "uvicorn",
    "sqlalchemy",
    "pydantic[email]",
    "pydantic-settings",
    "python-dotenv",
    "reportlab>=4.2.0",
    "python-multipart",
    "python-jose[cryptography]",
    "cryptography",
    "passlib[bcrypt]",
    "bcrypt<4",
    "captcha",
    "psutil",
    "croniter",
    "PyYAML",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-bash>=0.25,<0.26",
    "regex>=2026.2.28",
]

[tool.uv]
package = false
