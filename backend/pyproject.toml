[project]
name = "agent-manager-admin-backend"
version = "0.1.0"
description = "Admin starter backend for Agent Manager"
requires-python = ">=3.10"
dependencies = [
    "cisco-ai-skill-scanner",
    "fastapi",
    "httpx",
    "httpx[socks]",
    "uvicorn",
    "sqlalchemy",
    "pydantic[email]",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt<4",
    "captcha",
    "psutil",
    "croniter",
    "PyYAML",
]

[tool.uv]
package = false
