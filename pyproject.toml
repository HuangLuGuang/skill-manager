[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-manager"
version = "0.1.0"
description = "Enterprise skill lifecycle manager — vet, approve, deploy, and govern AI agent skills"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

dependencies = [
    "psutil>=7.2.2",
    "cryptography>=44.0.0",
    "pydantic>=2.6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "PyYAML>=6.0.1",
    "fastapi>=0.125.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "httpx[socks]>=0.28.1",
    "jsonschema>=4.26.0",
    "agno>=2.6.9",
    "openai>=2.30.0",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
scanner = [
    "cisco-ai-skill-scanner",
]
# Headroom 智能上下文压缩（可选）
compression = [
    # SmartCrusher (JSON) + CodeCompressor (AST) 纯本地，无需 HF 模型
    "headroom-ai>=0.24.0",
]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.14.0",
    "mypy>=1.8.0",
]

[project.scripts]
agent-manager = "agent_manager.cli.cli:main"
agent-manager-api = "agent_manager.api.api_cli:main"
agent-manager-deploy = "agent_manager.hooks.deploy:main"
agent-manager-install-hooks = "agent_manager.hooks.install:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_manager"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "F401", "F841", "B904", "B006", "B007", "B008", "B023"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    # Root-level pytest imports the backend model-gateway modules directly.
    # These backend-only packages stay in the dev group so `uv run pytest`
    # works from the repository root; production backend deps live in backend/pyproject.toml.
    "bcrypt<4",
    "captcha",
    "croniter",
    "cryptography",
    "loguru==0.7.3",
    "passlib[bcrypt]",
    "pydantic-settings",
    "pydantic[email]",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pypdf>=5.0.0",
    "python-jose[cryptography]",
    "sqlalchemy",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-bash>=0.25,<0.26",
    "regex>=2026.2.28",
]
