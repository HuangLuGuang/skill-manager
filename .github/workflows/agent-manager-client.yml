name: Agent Manager Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "client-v*"
    paths:
      - "client/desktop/**"
      - "scanner/cmd/agent-manager-client/**"
      - "scanner/internal/managedclient/**"
      - "scanner/go.mod"
      - "scanner/go.sum"
      - ".github/workflows/agent-manager-client.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            build_script: build:mac
            release_script: release:mac
            platform_key: darwin-aarch64
          - os: macos-15-intel
            build_script: build:mac
            release_script: release:mac
            platform_key: darwin-x86_64
          - os: windows-2022
            build_script: build:windows
            release_script: release:windows
            platform_key: windows-x86_64
          - os: ubuntu-22.04
            build_script: build:linux
            release_script: release:linux
            platform_key: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scanner/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/desktop/package-lock.json
      - name: Validate release version
        if: ${{ startsWith(github.ref, 'refs/tags/client-v') }}
        run: node client/desktop/scripts/validate-release-version.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: client/desktop
      - name: Validate desktop translations
        run: npm run test:i18n
        working-directory: client/desktop
      - name: Build development artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/client-v') }}
        run: npm run ${{ matrix.build_script }}
        working-directory: client/desktop
      - name: Validate Apple release credentials
        if: ${{ runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/client-v') }}
        shell: bash
        env:
          AGENT_MANAGER_MACOS_SIGNING_MODE: ${{ vars.AGENT_MANAGER_MACOS_SIGNING_MODE || 'adhoc' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$AGENT_MANAGER_MACOS_SIGNING_MODE" == "adhoc" ]]; then
            echo "Building an ad-hoc signed macOS artifact for testing."
            exit 0
          fi
          if [[ "$AGENT_MANAGER_MACOS_SIGNING_MODE" != "developer-id" ]]; then
            echo "Unsupported AGENT_MANAGER_MACOS_SIGNING_MODE: $AGENT_MANAGER_MACOS_SIGNING_MODE" >&2
            exit 1
          fi
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          certificate_path="${RUNNER_TEMP}/agent-manager-developer-id.p12"
          private_key_path="${RUNNER_TEMP}/agent-manager-developer-id-key.pem"
          trap 'rm -f "$certificate_path" "$private_key_path"' EXIT
          if ! printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path" || [[ ! -s "$certificate_path" ]]; then
            echo "APPLE_CERTIFICATE 不是有效的 Base64 内容，请填写包含私钥的 .p12 文件编码结果。" >&2
            exit 1
          fi
          if ! openssl pkcs12 -in "$certificate_path" -passin env:APPLE_CERTIFICATE_PASSWORD -noout; then
            echo "无法解析 APPLE_CERTIFICATE，请检查 .p12 文件和 APPLE_CERTIFICATE_PASSWORD。" >&2
            exit 1
          fi
          certificate_subject="$(
            openssl pkcs12 -in "$certificate_path" -passin env:APPLE_CERTIFICATE_PASSWORD -clcerts -nokeys |
              openssl x509 -noout -subject
          )"
          if [[ "$certificate_subject" != *"Developer ID Application:"* ]]; then
            echo "APPLE_CERTIFICATE 不是 Developer ID Application 证书: $certificate_subject" >&2
            exit 1
          fi
          if ! openssl pkcs12 -in "$certificate_path" -passin env:APPLE_CERTIFICATE_PASSWORD -nocerts -nodes -out "$private_key_path" ||
             ! grep -q 'PRIVATE KEY' "$private_key_path"; then
            echo "APPLE_CERTIFICATE 不包含私钥，请从钥匙串的“我的证书”中导出 .p12。" >&2
            exit 1
          fi
      - name: Build ad-hoc signed macOS release
        if: ${{ runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/client-v') && vars.AGENT_MANAGER_MACOS_SIGNING_MODE != 'developer-id' }}
        run: npm run ${{ matrix.release_script }}
        working-directory: client/desktop
        env:
          AGENT_MANAGER_CLIENT_VERSION: ${{ github.ref_name }}
          AGENT_MANAGER_UPDATER_PUBLIC_KEY: ${{ secrets.AGENT_MANAGER_UPDATER_PUBLIC_KEY }}
          AGENT_MANAGER_UPDATER_PRIVATE_KEY: ${{ secrets.AGENT_MANAGER_UPDATER_PRIVATE_KEY }}
          AGENT_MANAGER_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.AGENT_MANAGER_UPDATER_PRIVATE_KEY_PASSWORD }}
          AGENT_MANAGER_MACOS_SIGNING_MODE: adhoc
      - name: Build Developer ID signed macOS release
        if: ${{ runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/client-v') && vars.AGENT_MANAGER_MACOS_SIGNING_MODE == 'developer-id' }}
        run: npm run ${{ matrix.release_script }}
        working-directory: client/desktop
        env:
          AGENT_MANAGER_CLIENT_VERSION: ${{ github.ref_name }}
          AGENT_MANAGER_UPDATER_PUBLIC_KEY: ${{ secrets.AGENT_MANAGER_UPDATER_PUBLIC_KEY }}
          AGENT_MANAGER_UPDATER_PRIVATE_KEY: ${{ secrets.AGENT_MANAGER_UPDATER_PRIVATE_KEY }}
          AGENT_MANAGER_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.AGENT_MANAGER_UPDATER_PRIVATE_KEY_PASSWORD }}
          AGENT_MANAGER_MACOS_SIGNING_MODE: developer-id
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify signed and notarized macOS release
        if: ${{ runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/client-v') }}
        run: scripts/verify-macos-release.sh
        working-directory: client/desktop
        env:
          AGENT_MANAGER_MACOS_SIGNING_MODE: ${{ vars.AGENT_MANAGER_MACOS_SIGNING_MODE || 'adhoc' }}
      - name: Build signed non-macOS release
        if: ${{ runner.os != 'macOS' && startsWith(github.ref, 'refs/tags/client-v') }}
        run: npm run ${{ matrix.release_script }}
        working-directory: client/desktop
        env:
          AGENT_MANAGER_CLIENT_VERSION: ${{ github.ref_name }}
          AGENT_MANAGER_UPDATER_PUBLIC_KEY: ${{ secrets.AGENT_MANAGER_UPDATER_PUBLIC_KEY }}
          AGENT_MANAGER_UPDATER_PRIVATE_KEY: ${{ secrets.AGENT_MANAGER_UPDATER_PRIVATE_KEY }}
          AGENT_MANAGER_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.AGENT_MANAGER_UPDATER_PRIVATE_KEY_PASSWORD }}
      - name: Collect release artifact
        if: ${{ startsWith(github.ref, 'refs/tags/client-v') }}
        run: node scripts/collect-updater-artifact.mjs ${{ matrix.platform_key }} "${{ github.ref_name }}"
        working-directory: client/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: agent-manager-client-${{ runner.os }}-${{ runner.arch }}
          path: client/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ startsWith(github.ref, 'refs/tags/client-v') }}
        with:
          name: agent-manager-client-update-${{ matrix.platform_key }}
          path: client/desktop/release-output/**
          if-no-files-found: error
          retention-days: 30

  update-manifest:
    if: ${{ startsWith(github.ref, 'refs/tags/client-v') }}
    needs: build
    runs-on: ubuntu-22.04
    env:
      WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-manager-client-update-*
          path: client-updates
          merge-multiple: true
      - run: node client/desktop/scripts/generate-update-manifest.mjs client-updates "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-manager-client-update-feed
          path: |
            client-updates/agent-manager-client-*
            client-updates/latest.json
          if-no-files-found: error
          retention-days: 90
      - name: Notify client build complete
        if: ${{ env.WECHAT_WEBHOOK_URL != '' }}
        run: >-
          curl --fail --silent --show-error "$WECHAT_WEBHOOK_URL"
          -H 'Content-Type: application/json'
          -d '{"msgtype":"text","text":{"content":"Agent Manager 客户端 ${{ github.ref_name }} 四平台构建完成，准备同步到 35。"}}'

  publish-to-35:
    if: ${{ startsWith(github.ref, 'refs/tags/client-v') }}
    needs: update-manifest
    runs-on: [self-hosted, linux, x64, agent-manager-release]
    timeout-minutes: 15
    concurrency:
      group: agent-manager-client-publish-35
      cancel-in-progress: false
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: agent-manager-client-update-feed
          path: client-updates
      - name: Publish client releases
        id: publish
        run: |
          version="${GITHUB_REF_NAME#client-v}"
          target="/home/ubuntu/releases/client-${version}"
          live="/home/ubuntu/skill-manager/scanner/releases"
          test -f "client-updates/latest.json"
          test -f "client-updates/agent-manager-client-${version}-darwin-aarch64.dmg"
          test -f "client-updates/agent-manager-client-${version}-darwin-x86_64.dmg"
          test -f "client-updates/agent-manager-client-${version}-windows-x86_64.exe"
          test -f "client-updates/agent-manager-client-${version}-linux-x86_64.AppImage"
          mkdir -p "$target" "$live"
          cp -a client-updates/. "$target"/
          decision="$(node client/desktop/scripts/should-publish-update.mjs client-updates/latest.json "$live/latest.json")"
          if [[ "$decision" == "publish" ]]; then
            cp -a client-updates/. "$live"/
            ln -sfn "client-${version}" /home/ubuntu/releases/client-latest
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Published client ${version} as latest."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Archived client ${version}; a newer client remains latest."
          fi

  notify-publish-result:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/client-v') }}
    needs: [build, update-manifest, publish-to-35]
    runs-on: ubuntu-22.04
    env:
      WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
    steps:
      - name: Notify success
        if: ${{ env.WECHAT_WEBHOOK_URL != '' && needs.publish-to-35.result == 'success' && needs.publish-to-35.outputs.published == 'true' }}
        run: >-
          curl --fail --silent --show-error "$WECHAT_WEBHOOK_URL"
          -H 'Content-Type: application/json'
          -d '{"msgtype":"text","text":{"content":"Agent Manager 客户端 ${{ github.ref_name }} 已同步到 35，管理台可直接下载。"}}'
      - name: Notify archived older release
        if: ${{ env.WECHAT_WEBHOOK_URL != '' && needs.publish-to-35.result == 'success' && needs.publish-to-35.outputs.published != 'true' }}
        run: >-
          curl --fail --silent --show-error "$WECHAT_WEBHOOK_URL"
          -H 'Content-Type: application/json'
          -d '{"msgtype":"text","text":{"content":"Agent Manager 客户端 ${{ github.ref_name }} 已归档；35 上已有更高版本，未替换当前最新版。"}}'
      - name: Notify failure
        if: ${{ env.WECHAT_WEBHOOK_URL != '' && needs.publish-to-35.result != 'success' }}
        run: >-
          curl --fail --silent --show-error "$WECHAT_WEBHOOK_URL"
          -H 'Content-Type: application/json'
          -d '{"msgtype":"text","text":{"content":"Agent Manager 客户端 ${{ github.ref_name }} 发布失败，请检查 GitHub Actions。"}}'
