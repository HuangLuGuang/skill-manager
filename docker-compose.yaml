services:
  backend:
    image: agent-manager-backend:${TAG:-latest}
    env_file:
      - path: .env
        required: false
    environment:
      # Local Compose is bootable without a prepared .env. Production must set
      # ENFORCE_SECURE_STARTUP=true and replace all placeholder credentials.
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-false}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      DATA_DIR: /app/runtime/data
      UPLOADS_DIR: /app/runtime/uploads
      SQLITE_PATH: /app/runtime/sqlite/admin_starter.db
      AGENT_MANAGER_REGISTRY_SQLITE_PATH: /app/runtime/sqlite/admin_starter.db
      AGENT_MANAGER_DATA_DIR: /app/runtime/agent_manager
      AGENT_MANAGER_SCAN_WORKERS: ${AGENT_MANAGER_SCAN_WORKERS:-2}
      AGENT_MANAGER_ANALYZER_WORKERS: ${AGENT_MANAGER_ANALYZER_WORKERS:-8}
      AGENT_MANAGER_SKILLSPECTOR_CONCURRENCY: ${AGENT_MANAGER_SKILLSPECTOR_CONCURRENCY:-2}
      AGENT_MANAGER_SANDBOX_RUNTIME: ${AGENT_MANAGER_SANDBOX_RUNTIME:-remote}
      AGENT_MANAGER_SANDBOX_URL: ${AGENT_MANAGER_SANDBOX_URL:-http://sandbox:8194}
      AGENT_MANAGER_SANDBOX_API_KEY: ${AGENT_MANAGER_SANDBOX_API_KEY:-sandbox-change-me}
      AGENT_MANAGER_SIGNING_PRIVATE_KEY_PATH: ${AGENT_MANAGER_SIGNING_PRIVATE_KEY_PATH:-/app/runtime/agent_manager/signing/skill-ed25519.pem}
      AUDIT_SIGNING_PRIVATE_KEY_PATH: ${AUDIT_SIGNING_PRIVATE_KEY_PATH:-/app/runtime/data/signing/audit-ed25519.pem}
      SECURITY_AUDIT_EXPORT_PATH: ${SECURITY_AUDIT_EXPORT_PATH:-/app/runtime/data/audit/security-audit.jsonl}
      MCP_ALLOW_HTTP: ${MCP_ALLOW_HTTP:-false}
      MCP_OUTBOUND_ALLOWLIST: ${MCP_OUTBOUND_ALLOWLIST:-}
      MCP_MAX_RESPONSE_KB: ${MCP_MAX_RESPONSE_KB:-1024}
      AGENT_SECURITY_UPSTREAM_LOCK_PATH: /app/deploy/agent-security/upstreams.lock.json
      AGENT_SECURITY_WORKER_TOKEN: ${AGENT_SECURITY_WORKER_TOKEN:-}
      AIG_SERVICE_URL: http://aig-scan-service:8093
      AIG_SERVICE_TOKEN: ${AIG_SCAN_SERVICE_TOKEN:-}
      ENFORCE_SECURE_STARTUP: ${ENFORCE_SECURE_STARTUP:-false}
    depends_on:
      sandbox:
        condition: service_healthy
    volumes:
      - backend_data:/app/runtime/data
      - backend_uploads:/app/runtime/uploads
      - backend_sqlite:/app/runtime/sqlite
      - agent_manager_registry:/app/runtime/agent_manager
      - ./scanner/releases:/app/scanner/releases:ro
    networks:
      - app
      - sandbox-control
      - aig-control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  agent-security-worker:
    profiles: ["agent-security"]
    image: agent-manager-security-worker:${TAG:-latest}
    environment:
      AGENT_SECURITY_CONTROL_PLANE_URL: http://backend:8000/api/v1/agent-security
      AGENT_SECURITY_WORKER_TOKEN: ${AGENT_SECURITY_WORKER_TOKEN:-}
      AGENT_SECURITY_WORKER_POLL_SECONDS: ${AGENT_SECURITY_WORKER_POLL_SECONDS:-5}
      AGENT_SECURITY_EVALUATOR_API_KEY: ${AGENT_SECURITY_EVALUATOR_API_KEY:-}
      AGENT_SECURITY_EVALUATOR_MODEL: ${AGENT_SECURITY_EVALUATOR_MODEL:-}
      AGENT_SECURITY_EVALUATOR_BASE_URL: ${AGENT_SECURITY_EVALUATOR_BASE_URL:-http://backend:8000/v1}
      AGENT_SECURITY_EVALUATOR_INPUT_COST_MICRO_PER_MILLION: ${AGENT_SECURITY_EVALUATOR_INPUT_COST_MICRO_PER_MILLION:-0}
      AGENT_SECURITY_EVALUATOR_OUTPUT_COST_MICRO_PER_MILLION: ${AGENT_SECURITY_EVALUATOR_OUTPUT_COST_MICRO_PER_MILLION:-0}
      AIG_AGENT_SCAN_LOG_LEVEL: ${AIG_AGENT_SCAN_LOG_LEVEL:-WARNING}
      AIG_SERVICE_URL: http://aig-scan-service:8093
      AIG_SERVICE_TOKEN: ${AIG_SCAN_SERVICE_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
      aig-scan-service:
        condition: service_healthy
    read_only: true
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${AGENT_SECURITY_WORKER_TMPFS_SIZE:-64m}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${AGENT_SECURITY_WORKER_PIDS_LIMIT:-128}
    mem_limit: ${AGENT_SECURITY_WORKER_MEMORY_LIMIT:-512m}
    cpus: ${AGENT_SECURITY_WORKER_CPU_LIMIT:-1.0}
    healthcheck:
      test: ["CMD", "python", "/app/worker.py", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: ${AGENT_SECURITY_WORKER_STOP_GRACE_PERIOD:-30s}
    logging:
      driver: json-file
      options:
        max-size: ${AGENT_SECURITY_WORKER_LOG_MAX_SIZE:-10m}
        max-file: ${AGENT_SECURITY_WORKER_LOG_MAX_FILES:-3}
    networks:
      - app
      - aig-control

  aig-scan-service:
    profiles: ["agent-security"]
    image: agent-manager-aig-scan-service:${TAG:-latest}
    environment:
      AIG_WRAPPER_TOKEN: ${AIG_SCAN_SERVICE_TOKEN:-}
      AIG_WRAPPER_DB: /var/lib/aig-wrapper/jobs.db
      AIG_WRAPPER_MAX_JOBS: ${AIG_SCAN_SERVICE_MAX_JOBS:-100}
      AIG_AGENT_READY_SECONDS: ${AIG_SCAN_SERVICE_AGENT_READY_SECONDS:-2}
      DB_PATH: /tmp/aig-upstream/tasks.db
      AIG_API_CHECKER_URL: ""
    read_only: true
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${AIG_SCAN_SERVICE_TMPFS_SIZE:-512m}
    volumes:
      - aig_scan_jobs:/var/lib/aig-wrapper
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${AIG_SCAN_SERVICE_PIDS_LIMIT:-256}
    mem_limit: ${AIG_SCAN_SERVICE_MEMORY_LIMIT:-2g}
    cpus: ${AIG_SCAN_SERVICE_CPU_LIMIT:-2.0}
    healthcheck:
      test: ["CMD", "python", "/opt/service/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    stop_grace_period: ${AIG_SCAN_SERVICE_STOP_GRACE_PERIOD:-30s}
    logging:
      driver: json-file
      options:
        max-size: ${AIG_SCAN_SERVICE_LOG_MAX_SIZE:-10m}
        max-file: ${AIG_SCAN_SERVICE_LOG_MAX_FILES:-3}
    networks:
      - aig-control

  frontend:
    image: agent-manager-frontend:${TAG:-latest}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app

  mcp-demo:
    profiles: ["examples"]
    image: agent-manager-backend:${TAG:-latest}
    command: ["python", "/app/demo/mcp-customer-operations/server.py"]
    environment:
      MCP_DEMO_TOKEN: ${MCP_DEMO_TOKEN:-mcp-demo-change-me}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app

  sandbox:
    image: agent-manager-sandbox:${TAG:-latest}
    ports:
      - 127.0.0.1:8194:8194
    env_file:
      - path: .env
        required: false
    environment:
      SANDBOX_SERVICE_BACKEND: nsjail
      SANDBOX_SERVICE_API_KEY: ${AGENT_MANAGER_SANDBOX_API_KEY:-sandbox-change-me}
      SANDBOX_SERVICE_ENFORCE_SECURE_STARTUP: ${ENFORCE_SECURE_STARTUP:-false}
      SANDBOX_SERVICE_WORK_ROOT: /tmp/isolated-sandbox-service
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    networks:
      - sandbox-control
      # Also attach the service process to a regular bridge so 127.0.0.1:8194
      # works when frontend/backend run on the host. Executed code still runs
      # inside nsjail's separate network namespace with networking disabled.
      - app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8194/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app

volumes:
  backend_data:
  backend_uploads:
  backend_sqlite:
  agent_manager_registry:
  aig_scan_jobs:

networks:
  app:
  sandbox-control:
    internal: true
  aig-control:
